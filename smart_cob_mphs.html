        function escapeHtml(str) {

                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')

        function formatFileSize(bytes) {
            if (!bytes || isNaN(bytes)) return '-';
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const styles = {

                error: 'bg-red-700 text-white border-red-600',
                warning: 'bg-amber-500 text-gray-950 border-amber-400',
                info: 'bg-slate-800 text-white border-slate-700'
            };
            const icons = {
                success: 'fa-circle-check',
                error: 'fa-circle-exclamation',
                warning: 'fa-triangle-exclamation',
                info: 'fa-circle-info'
            };
            const toast = document.createElement('div');
            toast.className = `px-4 py-3 rounded-xl shadow-xl border text-xs sm:text-sm font-semibold flex items-center gap-2.5 transition-all duration-300 ${styles[type] || styles.info}`;
            toast.innerHTML = `<i class="fa-solid ${icons[type] || icons.info} text-base shrink-0"></i><span>${escapeHtml(message)}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(8px)';
                setTimeout(() => toast.remove(), 300);
            }, 3800);
        }

        function getPdfBlobUrl(id, dataUrl) {
            if (!dataUrl) return null;
            if (pdfBlobUrlCache.has(id)) return pdfBlobUrlCache.get(id);
            try {
                const parts = dataUrl.split(',');
                const mimeMatch = parts[0].match(/:(.*?);/);
                const mime = mimeMatch ? mimeMatch[1] : 'application/pdf';
                const binary = atob(parts[1]);
                const len = binary.length;
                const bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) bytes[i] = binary.charCodeAt(i);
                const blobUrl = URL.createObjectURL(new Blob([bytes], { type: mime }));
                pdfBlobUrlCache.set(id, blobUrl);
                return blobUrl;
            } catch (err) {
                return dataUrl;
            }
        }

        function addBusinessDays(dateStr, businessDays, isCalendarDays = false) {
            if (!dateStr || !businessDays || businessDays <= 0) return null;
            const parts = dateStr.split('-').map(Number);
            if (parts.length !== 3) return null;
            const d = new Date(parts[0], parts[1] - 1, parts[2]);
            if (isCalendarDays) {
                d.setDate(d.getDate() + businessDays);
            } else {
                let added = 0;
                while (added < businessDays) {
                    d.setDate(d.getDate() + 1);
                    const day = d.getDay();
                    if (day !== 0 && day !== 6) added++;
                }
            }
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

        function getRemainingBusinessDays(deadlineStr, isCalendarDays = false) {
            if (!deadlineStr) return null;
            const parts = deadlineStr.split('-').map(Number);
            if (parts.length !== 3) return null;
            const target = new Date(parts[0], parts[1] - 1, parts[2]);
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            if (target.getTime() === today.getTime()) return 0;

            if (isCalendarDays) {
                return Math.round((target.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
            }

            let count = 0;
            const step = target > today ? 1 : -1;
            const cur = new Date(today);
            while ((step > 0 && cur < target) || (step < 0 && cur > target)) {
                cur.setDate(cur.getDate() + step);
                const day = cur.getDay();
                if (day !== 0 && day !== 6) count += step;
            }
            return count;
        }

        function getCharterStatus(letter) {
            const sla = parseInt(letter.slaDays || 0, 10);
            const isNotis = (letter.docCategory || 'Surat') === 'Notis';
            const unitShort = isNotis ? 'H' : 'HB';
            if (!sla) return { level: 'none', label: 'Tiada Tempoh', rem: null };
            if (letter.status === 'Selesai') return { level: 'done', label: `Mematuhi (${sla}${unitShort})`, rem: 0 };
            const due = letter.deadlineDate || addBusinessDays(letter.dateReceived, sla, isNotis);
            const rem = getRemainingBusinessDays(due, isNotis);
            if (rem === null) return { level: 'none', label: 'Tiada Tempoh', rem: null };
            if (rem < 0) return { level: 'overdue', label: `Lewat ${Math.abs(rem)} Hari`, rem };
            if (rem <= 3) return { level: 'warning', label: `Baki ${rem} Hari`, rem };
            return { level: 'ok', label: `Baki ${rem} Hari (${sla}${unitShort})`, rem };
        }

            }
            return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-semibold bg-blue-50 text-blue-700 border border-blue-200"><i class="fa-regular fa-calendar-check"></i> ${st.label}</span>`;
        }

        function canManageLetterRecord(letter) {
            if (!currentUser) return false;
            if (currentUser.role === 'admin' || currentUser.role === 'hod') return true;
            if (!letter) return true;
            const sameName = (letter.officer || '').trim().toLowerCase() === (currentUser.name || '').trim().toLowerCase();
            const sameEmail = letter.officerEmail && currentUser.email && letter.officerEmail.trim().toLowerCase() === currentUser.email.trim().toLowerCase();
            return sameName || sameEmail;
        }

                const savedAnn = localStorage.getItem(STORAGE_KEYS.ANNOUNCEMENTS);

                letters = savedLetters ? JSON.parse(savedLetters) : [...DEFAULT_LETTERS];
                announcements = savedAnn ? JSON.parse(savedAnn) : [...DEFAULT_ANNOUNCEMENTS];

        async function initApp() {
            loadLocalData();

            try {
                const sessionRaw = sessionStorage.getItem(STORAGE_KEYS.SESSION);
                if (sessionRaw) {
                    const parsed = JSON.parse(sessionRaw);
                    const matched = users.find(u => u.id === parsed.id || u.username === parsed.username);
                    if (matched) currentUser = matched;
                }
            } catch (err) {}

            try {
                if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                    const config = JSON.parse(__firebase_config);
                    if (config && config.apiKey) {
                        app = initializeApp(config);
                        auth = getAuth(app);
                        db = getFirestore(app);
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                        isLocalMode = false;

                        onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'letters'), (snap) => {
                            if (!snap.empty) {
                                letters = snap.docs.map(d => ({ id: d.id, ...d.data() }))
                                    .sort((a, b) => (b.dateReceived || '').localeCompare(a.dateReceived || ''));
                                renderApp();
                            }
                        }, () => { isLocalMode = true; });

                        onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'announcements'), (snap) => {
                            if (!snap.empty) {
                                announcements = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                                if (!selectedAnnouncementId && announcements.length) selectedAnnouncementId = announcements[0].id;
                                renderApp();
                            }
                        }, () => { isLocalMode = true; });
                    }
                }
            } catch (err) {
                isLocalMode = true;
            }

            renderApp();
        }

        // =========================================================================
        window.notifyOfficerEmail = function(letterId) {
            const letter = letters.find(l => l.id === letterId);
            if (!letter) return;

            const toEmail = letter.officerEmail || DEPARTMENT_EMAIL;
            const docLabel = letter.docCategory || 'Surat';
            const isNotis = docLabel === 'Notis';
            const sla = parseInt(letter.slaDays || 0, 10);
            const unitLabel = isNotis ? 'Hari' : 'Hari Bekerja';
            const dueText = sla > 0
                ? `${sla} ${unitLabel} (Tarikh Akhir: ${letter.deadlineDate || addBusinessDays(letter.dateReceived, sla, isNotis) || '-'})`
                : 'Tiada Tempoh';
            const subject = `[SMART COB MPHS] Tindakan ${docLabel}: ${letter.refNo} - ${letter.subject}`;
            const body = [
                `Assalamualaikum & Salam Sejahtera ${letter.officer || 'Tuan/Puan'},`,
                ``,
                `Berikut adalah makluman tugasan ${docLabel.toLowerCase()} melalui SMART COB MPHS:`,
                ``,
                `• Jenis Dokumen      : ${docLabel} (${letter.type})`,
                `• No. Rujukan        : ${letter.refNo}`,
                `• Perkara            : ${letter.subject}`,
                `• Daripada / Kepada  : ${letter.senderReceiver}`,
                `• Kaedah Penyampaian : ${letter.deliveryMethod || '-'}`,
                `• Tarikh Rekod       : ${letter.dateReceived}`,
                `• Piagam Pelanggan   : ${dueText}`,
                `• Status Semasa      : ${letter.status}`,
                `• Minit / Catatan    : ${letter.minute || 'Sila ambil tindakan sewajarnya.'}`,
                ``,
                `Mohon pihak Tuan/Puan mengemaskini status tindakan dalam SMART COB MPHS bagi memastikan pematuhan piagam pelanggan jabatan.`,
                ``,
                `Sekian, terima kasih.`,
                `Bahagian Pesuruhjaya Bangunan (COB)`,
                `Majlis Perbandaran Hulu Selangor (${DEPARTMENT_EMAIL})`
            ].join('\n');

            const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(toEmail)}&cc=${encodeURIComponent(DEPARTMENT_EMAIL)}&su=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
            window.open(gmailUrl, '_blank', 'noopener,noreferrer');
            showToast(`Membuka Chrome Gmail kepada ${toEmail} (CC: ${DEPARTMENT_EMAIL})`, 'success');
        };

        function handleLogin(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('login-username').value.trim().toLowerCase();
            const passwordInput = document.getElementById('login-password').value;

            const found = users.find(u => u.username.toLowerCase() === usernameInput && u.password === passwordInput);
            if (!found) {
                showToast('ID Pengguna atau Kata Laluan tidak sah!', 'error');
                return;
            }

            currentUser = found;
            try {
                sessionStorage.setItem(STORAGE_KEYS.SESSION, JSON.stringify({ id: found.id, username: found.username }));
            } catch (err) {}

            showToast(`Selamat datang, ${found.name}!`, 'success');
            renderApp();

            const overdueCount = letters.filter(l => getCharterStatus(l).level === 'overdue').length;
            const warningCount = letters.filter(l => getCharterStatus(l).level === 'warning').length;
            if (overdueCount > 0 || warningCount > 0) {
                setTimeout(() => {
                    showToast(`Amaran Piagam: ${overdueCount} lewat tempoh & ${warningCount} hampir tamat!`, 'warning');
                }, 700);
            }
        }

        window.exportLettersCSV = function() {
            const filtered = getFilteredLetters();
            if (filtered.length === 0) {

            }
            const headers = ['Kategori', 'Jenis', 'Kaedah Penyampaian', 'No Rujukan', 'Perkara', 'Daripada/Kepada', 'Tarikh', 'Piagam (Hari)', 'Tarikh Akhir', 'Pegawai', 'Status', 'Minit'];
            const rows = filtered.map(l => [
                l.docCategory || 'Surat',
                l.type,
                l.deliveryMethod || '-',
                l.refNo,
                l.subject,
                l.senderReceiver,
                l.dateReceived,
                l.slaDays || 0,
                l.deadlineDate || '-',
                l.officer,
                l.status,
                l.minute || ''
            ].map(val => `"${String(val).replace(/"/g, '""')}"`).join(','));

            const csvContent = '\uFEFF' + [headers.join(','), ...rows].join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Laporan_SMART_COB_MPHS_${new Date().toISOString().slice(0, 10)}.csv`;
            a.click();
            URL.revokeObjectURL(url);
            showToast(`Berjaya mengeksport ${filtered.length} rekod ke fail CSV.`, 'success');
        };

            if (catEl) filterDocCategory = catEl.value;

        function getFilteredLetters() {
            return letters.filter(l => {
                const dateStr = l.dateReceived || '';
                const yr = dateStr.slice(0, 4);
                const mo = dateStr.slice(5, 7);

                if (activeYearTab !== 'ALL' && yr !== activeYearTab) return false;
                if (activeMonthTab !== 'ALL' && mo !== activeMonthTab) return false;
                if (filterDocCategory !== 'ALL' && (l.docCategory || 'Surat') !== filterDocCategory) return false;
                if (filterType !== 'ALL') {
                    const normalizedType = l.type === 'Surat Masuk' ? 'Masuk' : (l.type === 'Surat Keluar' ? 'Keluar' : l.type);
                    if (normalizedType !== filterType) return false;
                }
                if (filterStatus !== 'ALL' && l.status !== filterStatus) return false;

                if (searchQuery.trim() !== '') {
                    const q = searchQuery.toLowerCase();
                    const hay = `${l.refNo} ${l.subject} ${l.senderReceiver} ${l.officer} ${l.deliveryMethod || ''} ${l.docCategory || ''}`.toLowerCase();
                    if (!hay.includes(q)) return false;
                }
                return true;
            });
        }

                                                <td class="py-3.5 px-4 align-top text-right whitespace-nowrap">
                                                    <div class="inline-flex items-center gap-1.5">
                                                        <button onclick="notifyOfficerEmail('${l.id}')" title="Hantar Notifikasi Chrome Gmail (CC: ${DEPARTMENT_EMAIL})" class="w-8 h-8 rounded-lg bg-amber-50 hover:bg-amber-100 text-amber-700 border border-amber-200 flex items-center justify-center transition">
                                                            <i class="fa-solid fa-envelope"></i>
                                                        </button>
                                                        ${canEdit ? `
                                                            <button onclick="openLetterModal('${l.id}')" title="Kemaskini Rekod" class="w-8 h-8 rounded-lg bg-green-50 hover:bg-green-100 text-green-800 border border-green-200 flex items-center justify-center transition">
                                                                <i class="fa-solid fa-pen-to-square"></i>
                                                            </button>
                                                            <button onclick="deleteLetter('${l.id}')" title="Padam Rekod" class="w-8 h-8 rounded-lg bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 flex items-center justify-center transition">
                                                                <i class="fa-solid fa-trash-can"></i>
                                                            </button>
                                                        ` : `
                                                            <span title="Terkunci: Hanya pegawai bertugas atau Admin boleh kemaskini" class="px-2 py-1 rounded-lg bg-gray-100 text-gray-400 text-[10px] font-semibold inline-flex items-center gap-1">
                                                                <i class="fa-solid fa-lock"></i> Terkunci
                                                            </span>
                                                        `}
                                                    </div>
                                                </td>
                                            </tr>
                                        `;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderUsersView() {
            const isAdmin = currentUser && currentUser.role === 'admin';
            return `
                <div class="space-y-5">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                        <div>
                            <h2 class="text-xl font-extrabold text-gray-900">Direktori Pegawai &amp; Kawalan Akses</h2>
                            <p class="text-xs text-gray-500">Pegawai hanya boleh mengemaskini rekod tugasan sendiri; Mod Admin boleh mengedit pengguna &amp; menetapkan semula kata laluan.</p>
                        </div>
                        ${isAdmin ? `
                            <button onclick="openUserModal()" class="px-4 py-2.5 bg-green-800 hover:bg-green-900 text-white text-xs font-bold rounded-xl shadow-sm flex items-center gap-2 self-start">
                                <i class="fa-solid fa-user-plus"></i> Tambah Pegawai Baharu
                            </button>
                        ` : ''}
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        ${users.map(u => {
                            const taskCount = letters.filter(l => l.officer === u.name).length;
                            const roleBadge = u.role === 'admin'
                                ? 'bg-amber-100 text-amber-900'
                                : u.role === 'hod'
                                    ? 'bg-purple-100 text-purple-900'
                                    : 'bg-green-100 text-green-800';
                            const roleLabel = u.role === 'admin' ? 'Mod Admin' : u.role === 'hod' ? 'Ketua Jabatan' : 'Pegawai COB';
                            return `
                                <div class="bg-white rounded-2xl p-5 border border-gray-100 shadow-xs flex flex-col justify-between">
                                    <div>
                                        <div class="flex items-start justify-between gap-2 mb-3">
                                            <div class="w-11 h-11 rounded-xl bg-green-800 text-white font-extrabold flex items-center justify-center text-base">
                                                ${escapeHtml(u.name.charAt(0).toUpperCase())}
                                            </div>
                                            <span class="px-2.5 py-1 rounded-full text-[11px] font-bold ${roleBadge}">${roleLabel}</span>
                                        </div>
                                        <h3 class="font-bold text-base text-gray-900">${escapeHtml(u.name)}</h3>
                                        <p class="text-xs text-gray-500">${escapeHtml(u.position)}</p>
                                        <div class="mt-3 pt-3 border-t border-gray-100 space-y-1 text-xs text-gray-600">
                                            <p><i class="fa-solid fa-id-badge w-4 text-gray-400"></i> ID: <b>${escapeHtml(u.username)}</b></p>
                                            <p><i class="fa-solid fa-envelope w-4 text-gray-400"></i> ${escapeHtml(u.email)}</p>
                                            <p><i class="fa-solid fa-folder w-4 text-gray-400"></i> Tugasan Aktif/Rekod: <b>${taskCount}</b></p>
                                            ${isAdmin ? `<p><i class="fa-solid fa-key w-4 text-amber-500"></i> Kata Laluan: <code class="bg-gray-100 px-1.5 py-0.5 rounded font-bold text-gray-800">${escapeHtml(u.password)}</code></p>` : ''}
                                        </div>
                                    </div>
                                    ${isAdmin ? `
                                        <div class="mt-4 pt-3 border-t border-gray-100 flex items-center justify-end gap-2">
                                            <button onclick="openUserModal('${u.id}')" class="px-3 py-1.5 rounded-lg bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200 text-xs font-bold">
                                                <i class="fa-solid fa-user-pen mr-1"></i>Edit / Reset Kata Laluan
                                            </button>
                                            ${u.id !== currentUser.id ? `
                                                <button onclick="deleteUser('${u.id}')" class="w-8 h-8 rounded-lg bg-red-50 hover:bg-red-100 text-red-600 flex items-center justify-center">
                                                    <i class="fa-solid fa-trash-can text-xs"></i>
                                                </button>
                                            ` : ''}
                                        </div>
                                    ` : ''}
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function renderApp() {
            if (!currentUser) {
                renderLoginScreen();
                return;
            }

            const appEl = document.getElementById('app');
            const isAdmin = currentUser.role === 'admin';

            appEl.innerHTML = `
                <header class="bg-white border-b border-gray-200 sticky top-0 z-30">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
                        <div class="flex items-center gap-3 min-w-0">
                            <div ${isAdmin ? 'onclick="openLogoUploadModal()" title="Klik untuk tukar Logo Rasmi MPHS"' : ''} class="w-11 h-11 rounded-xl bg-white border border-gray-200 p-1.5 flex items-center justify-center shrink-0 ${isAdmin ? 'cursor-pointer hover:ring-2 hover:ring-green-600' : ''}">
                                ${getLogoImgTag("max-w-full max-h-full w-auto h-auto object-contain mx-auto block")}
                            </div>
                            <div class="min-w-0">
                                <div class="flex items-center gap-2">
                                    <h1 class="font-extrabold text-sm sm:text-lg text-gray-900 truncate">SMART COB MPHS</h1>
                                    <span class="hidden md:inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-bold bg-green-100 text-green-800">v2.0</span>
                                </div>
                                <p class="text-[11px] text-gray-500 truncate">Bahagian Pesuruhjaya Bangunan • Majlis Perbandaran Hulu Selangor</p>
                            </div>
                        </div>

                        <nav class="hidden md:flex items-center gap-1 bg-gray-100 p-1 rounded-xl">
                            <button onclick="setTab('dashboard')" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition ${activeTab === 'dashboard' ? 'bg-white text-green-800 shadow-2xs' : 'text-gray-600 hover:text-gray-900'}">
                                <i class="fa-solid fa-chart-pie mr-1.5"></i>Dashboard
                            </button>
                            <button onclick="setTab('letters')" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition ${activeTab === 'letters' ? 'bg-white text-green-800 shadow-2xs' : 'text-gray-600 hover:text-gray-900'}">
                                <i class="fa-solid fa-envelopes-bulk mr-1.5"></i>Surat &amp; Notis
                            </button>
                            <button onclick="setTab('users')" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition ${activeTab === 'users' ? 'bg-white text-green-800 shadow-2xs' : 'text-gray-600 hover:text-gray-900'}">
                                <i class="fa-solid fa-users-gear mr-1.5"></i>Pegawai
                            </button>
                        </nav>

                        <div class="flex items-center gap-3 shrink-0">
                            <div class="hidden sm:block text-right">
                                <p class="text-xs font-bold text-gray-900">${escapeHtml(currentUser.name)}</p>
                                <p class="text-[10px] font-semibold text-green-700">${escapeHtml(currentUser.position)}</p>
                            </div>
                            <button onclick="handleLogout()" title="Log Keluar" class="px-3 py-2 rounded-xl bg-red-50 hover:bg-red-100 text-red-700 text-xs font-bold transition flex items-center gap-1.5">
                                <i class="fa-solid fa-right-from-bracket"></i> <span class="hidden sm:inline">Keluar</span>
                            </button>
                        </div>
                    </div>

                    <div class="md:hidden border-t border-gray-100 px-4 py-2 flex items-center justify-around bg-gray-50">
                        <button onclick="setTab('dashboard')" class="px-3 py-1.5 rounded-lg text-xs font-bold ${activeTab === 'dashboard' ? 'bg-green-800 text-white' : 'text-gray-600'}">
                            <i class="fa-solid fa-chart-pie mr-1"></i>Dashboard
                        </button>
                        <button onclick="setTab('letters')" class="px-3 py-1.5 rounded-lg text-xs font-bold ${activeTab === 'letters' ? 'bg-green-800 text-white' : 'text-gray-600'}">
                            <i class="fa-solid fa-envelopes-bulk mr-1"></i>Surat &amp; Notis
                        </button>
                        <button onclick="setTab('users')" class="px-3 py-1.5 rounded-lg text-xs font-bold ${activeTab === 'users' ? 'bg-green-800 text-white' : 'text-gray-600'}">
                            <i class="fa-solid fa-users-gear mr-1"></i>Pegawai
                        </button>
                    </div>
                </header>

                <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
                    ${activeTab === 'dashboard' ? renderDashboardView() : activeTab === 'letters' ? renderLettersView() : renderUsersView()}
                </main>

                <footer class="bg-white border-t border-gray-200 py-4 px-4 text-center text-xs text-gray-500">
                    &copy; 2026 <strong class="text-gray-700">SMART COB MPHS</strong> • Bahagian Pesuruhjaya Bangunan, Majlis Perbandaran Hulu Selangor • Emel Rasmi: <span class="text-green-800 font-semibold">${DEPARTMENT_EMAIL}</span>
                </footer>
            `;
        }

        // Mulakan Aplikasi
        initApp();
    </script>
</body>
</html>
